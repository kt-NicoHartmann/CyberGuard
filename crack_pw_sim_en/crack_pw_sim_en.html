<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>CyberGuard | High-Precision Cracker</title>
    <link href="css/styles.css" rel="stylesheet" />
</head>

<body>
    <div id="terminal-overlay">
        <div id="log-scroll" style="color: var(--success); font-size: 0.7rem; width: 300px; height: 100px; overflow: hidden;"></div>
        <div class="matrix-text" id="cracking-display"></div>
        <div style="color: var(--success); letter-spacing: 5px;">DECRYPTING...</div>
    </div>
    <div class="container">
        <h1>System Intrusion Sim</h1>
        <div class="input-group">
            <input id="passwordInput" maxlength="24" placeholder="ENTER PASSWORD" type="text" />
        </div>
        <button class="crack-btn" id="crackBtn">Execute Attack</button>
        <div class="results" id="resultsArea" style="display: none;">
            <div class="result-row">
                <span class="label">Time to Crack</span>
                <span class="val highlight" id="timeVal">-</span>
            </div>
            <div class="result-row">
                <span class="label">Attempts Needed</span>
                <span class="val" id="attemptsVal">-</span>
            </div>
            <div class="result-row">
                <span class="label">Security Rating</span>
                <span class="val" id="ratingVal">-</span>
            </div>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>

</html>
